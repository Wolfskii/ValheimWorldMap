name: Nexus release mirror

'on':
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the plugin-only archive if Nexus lacks the latest published stable release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nexus-release-mirror
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/ci/test-nexus-release.py

  mirror:
    needs: checks
    if: github.repository == 'Wolfskii/ValheimWorldMap' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Prepare exact GitHub assets and inspect Nexus file versions
        id: prepare
        run: python3 tools/ci/nexus-release.py prepare --directory "$RUNNER_TEMP/nexus-release"

      - name: Mirror plugin-only archive
        if: steps.prepare.outputs.plugin_upload == 'true' && inputs.upload == true
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.prepare.outputs.plugin_id }}
          filename: ${{ runner.temp }}/nexus-release/ValheimWorldMap-${{ steps.prepare.outputs.version }}.zip
          version: ${{ steps.prepare.outputs.version }}
          display_name: ${{ steps.prepare.outputs.display_name }}
          description: ${{ steps.prepare.outputs.description }}
          category: main
          archive_existing_version: false
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          show_requirements_pop_up: true
          update_mod_version: true
          mod_id: ${{ steps.prepare.outputs.mod_id }}
          changelog: ${{ steps.prepare.outputs.changelog }}

      - name: Verify Nexus version and archive readback
        run: python3 tools/ci/nexus-release.py verify --directory "$RUNNER_TEMP/nexus-release"

      - name: Write distribution status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Nexus release mirror'
            echo "Status: $JOB_STATUS"
            echo 'Listing: https://www.nexusmods.com/valheim/mods/3571?tab=files'
            echo 'Nexus carries the plugin-only archive. The Full archive (plugin plus BepInEx) is on the GitHub release only.'
            echo 'Check the plugin download button for scan/quarantine status before closing the release.'
            echo 'If Nexus blocks the file, retain it for moderator review; do not repeatedly upload it.'
          } >> "$GITHUB_STEP_SUMMARY"
